# ==============================================================================
# Конфигурация nginx для React-приложения (SPA)
# ==============================================================================
# Пробрасывает API-запросы к бэкенду.
# Все остальные запросы отдаёт index.html (для маршрутизации на клиенте).
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Глобальная безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Раздаём статические файлы с кэшированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API-запросы пробрасываем к бэкенду
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Для SPA: все нестатические маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
