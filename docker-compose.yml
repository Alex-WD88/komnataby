# ==============================================================================
# Docker Compose для локальной разработки Komnataby
# ==============================================================================
# Сервисы:
#   db       — PostgreSQL
#   backend  — Django API
#   frontend — React + Vite (dev-server с hot-reload)
#   nginx    — nginx (опционально, для продакшен-сборки)
# ==============================================================================

services:
  # ----------------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-komnata_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Персистентное хранилище данных
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # ----------------------------------------------------------------
  # Django backend
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CORS_ALLOW_ALL: "True"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-komnata_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      # Hot-reload: монтируем исходный код
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ----------------------------------------------------------------
  # Frontend (dev-server Vite)
  # ----------------------------------------------------------------
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Игнорируем node_modules контейнера
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      HOST: 0.0.0.0
    command: npm run dev -- --host
    depends_on:
      - backend

# ==============================================================================
# Тона (volumes)
# ==============================================================================
volumes:
  postgres_data:
